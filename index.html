<script>
  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');
  const scanBtn = document.getElementById('scanBtn');
  const loadingState = document.getElementById('loadingState');
  const resultsCard = document.getElementById('resultsCard');

  let base64Image = "";

  imageInput.addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        imagePreview.src = evt.target.result;
        imagePreview.style.display = 'block';
        base64Image = evt.target.result.split(',')[1];
      };
      reader.readAsDataURL(file);
    }
  });

  scanBtn.addEventListener('click', async function() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
      alert('Please enter your Gemini API key in the configuration panel.');
      return;
    }
    if (!base64Image) {
      alert('Please upload a dictation image first.');
      return;
    }

    scanBtn.disabled = true;
    loadingState.style.display = 'block';
    resultsCard.style.display = 'none';

    const prompt = `
      You are an English teacher in a Hong Kong secondary school.
      Transcribe the handwritten dictation image and mark it against this Master Key:

      Part A Master:
      ${document.getElementById('partAKey').value}

      Part B Master (${document.getElementById('partBMode').value}):
      ${document.getElementById('partBKey').value}

      Part C Extra Master:
      ${document.getElementById('partCKey').value}

      EXACT HONG KONG MARKING RULES:
      1. PART A (40 Marks): 8 items, 5 marks each. All-or-nothing per item. Ignore capitalization.
      2. PART B (60 Marks): Deduct 4 marks per spelling error. Deduct 1 mark per missing/incorrect punctuation or capitalization.
      3. PART C EXTRA (10 Marks): 5 items, 2 marks each. All-or-nothing per item. Ignore capitalization.

      For the marked output, use standard HTML tags inside the strings to show errors:
      - Use <s style="color:red;">word</s> to strikethrough spelling mistakes, followed by <b style="color:green;">(correct)</b>.
      - Use <u style="color:red; decoration-style:wavy;">word</u> to underline capitalization or punctuation mistakes.

      Return ONLY a JSON object strictly adhering to this schema:
      {
        "part_a_score": 35,
        "part_b_score": 48,
        "part_c_score": 8,
        "total_score": 91,
        "marked_paper": {
          "part_a": ["1. <s style='color:red;'>tecnology</s> <b style='color:green;'>(technology)</b>"],
          "part_b": ["1. <u style='color:red;'>hong</u> <u style='color:red;'>kong</u> is a <s style='color:red;'>grate</s> <b style='color:green;'>(great)</b> city."],
          "part_c": ["1. <s style='color:red;'>creativty</s> <b style='color:green;'>(creativity)</b>"]
        },
        "part_b_deductions_detail": ["Sentence 1: -4 (spelling 'grate'), -2 (capitalization 'hong kong')"],
        "feedback_comments": "Good effort!"
      }
    `;

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: "image/jpeg", data: base64Image } }
            ]
          }]
        })
      });

      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);

      // Display Scores
      document.getElementById('totalScore').innerText = `Total Score: ${result.total_score} / 100 (+10 Extra)`;
      document.getElementById('partAScore').innerText = `${result.part_a_score} / 40`;
      document.getElementById('partBScore').innerText = `${result.part_b_score} / 60`;
      document.getElementById('partCScore').innerText = `${result.part_c_score} / 10`;

      // Render Visual Marked Dictation Paper
      const markedOutput = document.getElementById('transcriptionOutput');
      markedOutput.innerHTML = `
        <h4>Part A Marked:</h4> ${result.marked_paper.part_a.join('<br>')}<br><br>
        <h4>Part B Marked:</h4> ${result.marked_paper.part_b.join('<br>')}<br><br>
        <h4>Part C Marked:</h4> ${result.marked_paper.part_c.join('<br>')}
      `;

      // Display Deductions Detail
      const errorDiv = document.getElementById('errorDetails');
      errorDiv.innerHTML = '';
      if (result.part_b_deductions_detail && result.part_b_deductions_detail.length > 0) {
        result.part_b_deductions_detail.forEach(err => {
          const p = document.createElement('div');
          p.className = 'error-log';
          p.innerText = err;
          errorDiv.appendChild(p);
        });
      }

      document.getElementById('teacherFeedback').innerText = result.feedback_comments || "Good effort!";
      resultsCard.style.display = 'block';

    } catch (err) {
      alert("Error processing image: " + err.message);
    } finally {
      scanBtn.disabled = false;
      loadingState.style.display = 'none';
    }
  });
</script>
